<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 48" role="presentation">
  <defs>
    <linearGradient id="fg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0">
      <stop offset="0"    stop-color="#8A6B22" stop-opacity="0"/>
      <stop offset=".10"  stop-color="#B8912F"/>
      <stop offset=".38"  stop-color="#D6B15F"/>
      <stop offset=".5"   stop-color="#F3E0AE"/>
      <stop offset=".62"  stop-color="#D6B15F"/>
      <stop offset=".90"  stop-color="#B8912F"/>
      <stop offset="1"    stop-color="#8A6B22" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g stroke="url(#fg)" fill="none" stroke-width="2" stroke-linecap="round">
    <!-- the double rule, broken either side of the centre ornament -->
    <path d="M14 24h228M358 24h228"/>
    <path d="M70 30h172M358 30h172"/>
    <!-- left scroll: an S-curl rising into the centre -->
    <path d="M242 24c12 0 20-4 25-11"/>
    <path d="M267 13c-5-4-12-3-14 3s4 10 9 8 6-7 4-10"/>
    <path d="M242 30c14 2 24-1 30-8"/>
    <!-- right scroll, mirrored -->
    <path d="M358 24c-12 0-20-4-25-11"/>
    <path d="M333 13c5-4 12-3 14 3s-4 10-9 8-6-7-4-10"/>
    <path d="M358 30c-14 2-24-1-30-8"/>
    <!-- terminal curls -->
    <path d="M14 24c-6 0-10 4-10 8"/>
    <path d="M586 24c6 0 10 4 10 8"/>
  </g>
  <!-- centre lozenge and satellites -->
  <g fill="url(#fg)">
    <path d="M300 12l7 10-7 10-7-10z"/>
    <circle cx="280" cy="22" r="2.6"/>
    <circle cx="320" cy="22" r="2.6"/>
  </g>
</svg>
